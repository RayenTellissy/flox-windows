[package]
name = "flox-sys"
description = "Platform services: folders, keep-awake, toasts, media keys, file dialogs, WebView2 runtime check"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
flox-core.workspace = true
tracing.workspace = true
rfd.workspace = true

[target.'cfg(windows)'.dependencies]
# Extra features on top of the workspace set, for the Start menu shortcut that
# carries the toast identity (IShellLinkW + IPropertyStore + PKEY_AppUserModel_ID).
windows = { workspace = true, features = [
    "Win32_Storage_EnhancedStorage",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
] }
webview2-com.workspace = true
tauri-winrt-notification.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
